name: .NET API Deployment

on:
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore Solution
        run: dotnet restore DynamicDFSAPI/iProofProcessDFSService.sln

      - name: Build Solution
        run: dotnet build DynamicDFSAPI/iProofProcessDFSService.sln --configuration Release --no-restore

      - name: Publish API Project
        run: dotnet publish DynamicDFSAPI/iProofProcessService/iProofProcessService.csproj -c Release -r linux-x64 --self-contained true -o publish

      - name: Stop Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl stop CIMSIITDHAPI.service || true

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "publish/*"
          target: /home/cpsadmin/Presentations/CIMSIITDHAPI
          strip_components: 1

      - name: Start Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl daemon-reload
            sudo systemctl start CIMSIITDHAPI.service
            sudo systemctl status CIMSIITDHAPI.service --no-pager
