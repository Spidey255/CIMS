name: .NET API Deployment
on:
  workflow_call:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore Solution
        run: dotnet restore DynamicDFSAPI/iProofProcessDFSService.sln

      - name: Build Solution
        run: dotnet build DynamicDFSAPI/iProofProcessDFSService.sln --configuration Release --no-restore

      - name: Publish API Project
        run: dotnet publish DynamicDFSAPI/iProofProcessService/iProofProcessService.csproj -c Release -r linux-x64 --self-contained true -o publish

      - name: Install OpenVPN & sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn sshpass

      - name: Create VPN Config & Credentials
        run: |
          echo "${{ secrets.VPN_CONFIG }}" > vpn.ovpn
          printf '%s\n%s\n' "${{ secrets.VPN_USERNAME }}" "${{ secrets.VPN_PASSWORD }}" > vpn-auth.txt
          chmod 600 vpn.ovpn vpn-auth.txt

      - name: Connect VPN
        run: |
          sudo openvpn \
            --config vpn.ovpn \
            --auth-user-pass vpn-auth.txt \
            --daemon \
            --log /tmp/openvpn.log

      - name: Wait for VPN tunnel
        run: |
          for i in $(seq 1 60); do
            VPN_IFACE=$(ip link show | awk -F': ' '/^[0-9]+: (tun|tap)/{print $2}' | head -1)
            if [ -n "$VPN_IFACE" ]; then
              echo "VPN interface detected: $VPN_IFACE"
              break
            fi
            echo "Waiting for VPN interface... ($i/60)"
            sleep 2
          done
          if [ -z "$VPN_IFACE" ]; then
            echo "--- OpenVPN log ---"
            sudo cat /tmp/openvpn.log
            exit 1
          fi

      - name: Verify VPN Connectivity
        run: ping -c 4 ${{ secrets.SERVER_IP }}

      - name: Stop Service
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "sudo systemctl stop CIMSAPI.service || true"

      - name: Clear old API files
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "rm -rf /home/Share/Presentations/CIMSAPI/* && echo 'Old API files cleared'"

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "publish/*"
          target: /home/Share/Presentations/CIMSAPI
          strip_components: 1

      - name: Start Service
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "sudo systemctl daemon-reload && sudo systemctl start CIMSAPI.service && sudo systemctl status CIMSAPI.service --no-pager"

      - name: Cleanup VPN Secrets
        if: always()
        run: rm -f vpn.ovpn vpn-auth.txt
